<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hackathon 04</title>

    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <form id="orderForm" novalidate>
      <fieldset class="section">
        <legend>Customer Details</legend>

  
        <div class="form-row">
          <label for="customerName">Full Name</label>
          <input
            type="text"
            id="customerName"
            name="customerName"
            placeholder="e.g., Jordan Smith"
            autocomplete="name"
            required
          />
          <p class="hint">Your first and last name.</p>
          <p class="error" data-error-for="customerName"></p>
        </div>

    
        <div class="form-row">
          <label for="customerEmail">Email</label>
          <input
            type="email"
            id="customerEmail"
            name="customerEmail"
            placeholder="you@example.com"
        
          />
          <p class="hint">We’ll send your receipt here.</p>
          <p class="error" data-error-for="customerEmail"></p>
        </div>

        <div class="form-row">
          <label for="customerPhone">Tel no</label>
          <input
            type="tel"
            id="customerPhone"
            name="customerPhone"
            placeholder="1234567890"
            inputmode="numeric"
            pattern="\\d{10,15}"
        
          />
          <p class="hint">Digits only, 10–15 numbers.</p>
          <p class="error" data-error-for="customerPhone"></p>
        </div>
      </fieldset>

      
      <button type="submit">Continue</button>
    </form>

    <script src="script.js" defer></script>
  </body>
</html>

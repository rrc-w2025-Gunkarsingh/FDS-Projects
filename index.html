<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The Prairie Table</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <header class="header"></header>
    <main>
      <section class="dishes">
        <h2>Menu</h2>

        <section>
          <h3>Appetizer</h3>
          <figure>
            <img src="images/salad.jpeg" alt="Salad platter" width="400" height="400">
            <figcaption>Salad Platter - $7.99</figcaption>
          </figure>
          <figure>
            <img src="images/salami.jpeg" alt="Salami" width="400" height="400">
            <figcaption>Salami - $12.99</figcaption>
          </figure>
        </section>

        <section>
          <h3>Main Courses</h3>
          <figure>
            <img src="images/steak.jpg" alt="Filet steak" width="400" height="400">
            <figcaption>Filet Steak - $29.99</figcaption>
          </figure>
          <figure>
            <img src="images/pasta.jpg" alt="Pasta" width="400" height="400">
            <figcaption>Pasta - $16.99</figcaption>
          </figure>
        </section>

        <section>
          <h3>Beverages</h3>
          <figure>
            <img src="images/juice.jpg" alt="Green juice" width="400" height="400">
            <figcaption>Green Juice - $9.99</figcaption>
          </figure>
          <figure>
            <img src="images/orange.jpg" alt="Orange juice" width="400" height="400">
            <figcaption>Orange Juice - $9.99</figcaption>
          </figure>
        </section>
      </section>
    </main>
    <footer class="footer"></footer>
  </body>
</html>
